version: 1

defaults:
  target_crs: "EPSG:3857"
  tile_size: 512
  resampling: nearest
  clip_buffer_m: 2000
  clip_to: data/nuts3_ll.geojson
  min_zoom: 6
  max_zoom: 12

layers:
  - id: landuse-croptypes
    app_layer: agriculture
    kind: raster
    classification: categorical
    title:
      en: "Crop types (DLR, 2024)"
      de: "Anbaukulturen (DLR, 2024)"
    description:
      en: "Annual 10 m crop-type map for Germany derived from Sentinel-1/2 and LPIS with Random Forest."
      de: "Jaehrliche 10-m-Anbaukulturkarte fuer Deutschland aus Sentinel-1/2 und LPIS mit Random Forest."
    source:
      provider: "German Aerospace Center (DLR)"
      dataset: "CROPTYPES_DE_P1Y (2024 edition)"
      url: "https://geoservice.dlr.de/web/datasets/croptypes_de"
      stac: "https://geoservice.dlr.de/eoc/ogc/stac/v1/collections/CROPTYPES_DE_P1Y"
      download_index: "https://download.geoservice.dlr.de/CROPTYPES/files/"
      license: "CC-BY-4.0"
      attribution: "(c) DLR (2024), CC BY 4.0"
      citation: "Asam et al. 2022"
    input:
      path: data/croptypes_2024.tif
      download_url: "https://download.geoservice.dlr.de/CROPTYPES/files/croptypes_2024.tif"
      sha256: null
      crs: "EPSG:32632"
      resolution_m: 10
      nodata: 0
    build:
      script: python/build_pmtiles.py
      target_crs: "EPSG:3857"
      min_zoom: 6
      max_zoom: 12
      tile_size: 512
      resampling: nearest
    output:
      pmtiles: data/pmtiles/landuse-croptypes.pmtiles
      sync_to: app/public/data/pmtiles/landuse-croptypes.pmtiles
    legend:
      - { value: 11, label: { en: "winter wheat", de: "Winterweizen" }, color: "#c2e077" }
      - { value: 12, label: { en: "winter barley", de: "Wintergerste" }, color: "#9bc72d" }
      - { value: 13, label: { en: "winter rye", de: "Winterroggen" }, color: "#5ec597" }
      - { value: 14, label: { en: "other winter cereals", de: "Sonstiges Wintergetreide" }, color: "#359269" }
      - { value: 21, label: { en: "spring wheat", de: "Sommerweizen" }, color: "#225e43" }
      - { value: 22, label: { en: "spring barley", de: "Sommergerste" }, color: "#00b3ad" }
      - { value: 23, label: { en: "spring oat", de: "Sommerhafer" }, color: "#008581" }
      - { value: 30, label: { en: "maize", de: "Mais" }, color: "#005754" }
      - { value: 40, label: { en: "legumes", de: "Bohnen/Lupinen/Erbsen" }, color: "#eb5b25" }
      - { value: 50, label: { en: "potato", de: "Kartoffeln" }, color: "#dc4b14" }
      - { value: 60, label: { en: "sugar beet", de: "Zuckerrueben" }, color: "#bb3f11" }
      - { value: 71, label: { en: "rapeseed", de: "Raps" }, color: "#fce3da" }
      - { value: 81, label: { en: "clover/alfalfa", de: "Klee/Luzerne" }, color: "#83d2af" }
      - { value: 82, label: { en: "arable grass", de: "Ackergras" }, color: "#c3e9d8" }
      - { value: 83, label: { en: "permanent grassland", de: "Gruenland" }, color: "#bce9d2" }
      - { value: 90, label: { en: "vineyard", de: "Wein" }, color: "#e5f5ee" }
      - { value: 100, label: { en: "fruit trees and other woody vegetation", de: "Obst- und Feldgehoelz" }, color: "#8ffffc" }
      - { value: 110, label: { en: "hops", de: "Hopfen" }, color: "#66d1ff" }
      - { value: 111, label: { en: "other agricultural use", de: "Sonstige landwirtschaftliche Nutzung" }, color: "#3da5d9" }

  - id: io-lulc-landcover
    app_layer: landscape
    kind: raster
    classification: categorical
    # Whether a layer is built per-LL vs. nationally is not a config flag -- it is
    # determined by which script processes it (build_land_cover.py vs. build_pmtiles.py)
    # and by which output.* key is present (pmtiles_pattern vs. pmtiles). See
    # output.pmtiles_pattern below for this layer's per-LL output pattern.
    title:
      en: "Land cover (Esri/Impact Observatory, 2024)"
      de: "Landbedeckung (Esri/Impact Observatory, 2024)"
    description:
      en: "Annual 10 m land use / land cover classification for 2024, derived from Sentinel-2 with deep learning."
      de: "Jaehrliche 10-m-Landbedeckungsklassifikation 2024, abgeleitet aus Sentinel-2 mit Deep Learning."
    source:
      provider: "Impact Observatory / Esri / Microsoft"
      dataset: "10m Annual Land Use Land Cover (9-class), 2024"
      url: "https://registry.opendata.aws/io-lulc/"
      license: "CC-BY-4.0"
      attribution: "Esri, Impact Observatory, Microsoft - 10m Annual Land Use Land Cover, CC BY 4.0"
      citation: "Karra, Kontgis, et al. Global land use/land cover with Sentinel-2 and deep learning. IGARSS 2021."
      note: "The Impact Observatory STAC collection reports license: proprietary, but the AWS Registry of Open Data, the Microsoft Planetary Computer STAC collection, and Esri's own Living Atlas item licenseInfo all state CC BY 4.0 for the source raster. This project relies on the CC BY 4.0 reading."
    input:
      tiles:
        rheingau: "32U"
        hessian-low-mountain: "32U"
        north-hessian-loess: "32U"
        east-brandenburg: "33U"
        havellandisches-luch: "33U"
      path_pattern: "data/io_lulc_{tile}_2024.tif"
      download_url_pattern: "https://io-10m-annual-lulc.s3.us-west-2.amazonaws.com/{tile}_2024.tif"
      sha256_by_tile:
        "32U": "d7efc1a9561446d1eb15ec3f310b529ba1b2d47a36ac93a9f992e5de263d910f"
        "33U": "432f1e63781d0c9fcd9ec4e487c7fbfdab3ffee3309e2505036a4b1f51d4aad5"
      nodata: 0
      resolution_m: 10
    build:
      script: python/build_land_cover.py
      target_crs: "EPSG:3857"
      min_zoom: 6
      max_zoom: 12
      tile_size: 512
      resampling: nearest
    output:
      pmtiles_pattern: "data/pmtiles/land-cover-{slug}.pmtiles"
      sync_pattern: "app/public/data/pmtiles/land-cover-{slug}.pmtiles"
      class_histogram: "data/land_cover_class_histogram.json"
    legend:
      - { value: 1, label: { en: "Water", de: "Wasser" }, color: "#88bfd9" }
      - { value: 2, label: { en: "Forest", de: "Wald" }, color: "#276d4e" }
      - { value: 4, label: { en: "Wetland", de: "Feuchtgebiet" }, color: "#4f89a3" }
      - { value: 5, label: { en: "Cropland", de: "Ackerland" }, color: "#c2e077" }
      - { value: 7, label: { en: "Settlement", de: "Siedlung" }, color: "#b5ad9e" }
      - { value: 8, label: { en: "Bare ground", de: "Offenboden" }, color: "#d0b385" }
      - { value: 9, label: { en: "Snow / ice", de: "Schnee / Eis" }, color: "#f2f8e2" }
      - { value: 10, label: { en: "Clouds", de: "Wolken" }, color: "#c6d2d5" }
      - { value: 11, label: { en: "Grassland", de: "Gruenland" }, color: "#83d2af" }

  - id: buek250
    app_layer: soil
    kind: vector
    title:
      en: "Soil overview map (BUEK250)"
      de: "Bodenuebersichtskarte (BUEK250)"
    description:
      en: "General soil map of Germany at 1:250,000 scale, clipped to each living lab."
      de: "Bodenuebersichtskarte Deutschlands im Massstab 1:250.000, je Living Lab zugeschnitten."
    source:
      provider: "Bundesanstalt fuer Geowissenschaften und Rohstoffe (BGR)"
      dataset: "Bodenuebersichtskarte der Bundesrepublik Deutschland 1:250.000 (BUEK250), Version 6.0 mit Gewaesserflaechen"
      url: "https://www.bgr.bund.de/DE/Themen/Boden/Projekte/Flaechen_Rauminformationen_Boden/BUEK250/BUEK250.html"
      doi: "https://doi.org/10.25928/BUEK250_6.0"
      download_url: "https://download.bgr.de/bgr/boden/BUEK250/gpkg/buek250_mgm_utm_v60.zip"
      license: "Nutzungsbestimmungen fuer die Bereitstellung von Geodaten des Bundes (GeoNutzV)"
      attribution: "Datenquelle: BUEK250 V6.0, (c) BGR, Hannover, 2024"
      citation: "BGR (2024): Bodenuebersichtskarte der Bundesrepublik Deutschland 1:250.000 (BUEK250), Hannover. https://doi.org/10.25928/BUEK250_6.0"
    input:
      path: data/buek250_mgm_utm_v60/buek250_mgm_utm_v60.gpkg
      download_url: "https://download.bgr.de/bgr/boden/BUEK250/gpkg/buek250_mgm_utm_v60.zip"
      crs: "EPSG:25832"
    build:
      script: python/build_vector.py
    vector:
      gpkg_layer: buek250_mgm_utm_v60_poly
      keep_fields: [SYM_NR, GEN_ID, BEMERKUNG]
      semantics:
        sqlite_path: data/buek250_mgm_utm_v60/buek250_sachdatenbank_v10.sqlite
        contract_version: buek250-soil-semantics-v1
        tables:
          legend: buek250_Legendeneinheit__v10_tbl
          general_legend: buek250_GL_Einheit_v10_tbl
          parent_material: buek250_GL_BAGFlaechentyp_v10_tbl
          profile: buek250_Profil__v10_tbl
          horizon: buek250_Horizont__v10_tbl
        fallback_policy:
          sparse_values: Prefer semantic label/group/profile fields and keep GEN_ID, SYM_NR, and BEMERKUNG as provenance-only raw values.
          special_areas: Features without GEN_ID become explicit water_area or special_area records derived from BEMERKUNG.
          translations: English labels come from deterministic normalization rules in data-pipeline/python/soil_semantics.py.
      simplify_tolerance: 0.0005
      coordinate_precision: 0.0001
      output_dir: data/geojson
    output:
      geojson_pattern: "data/geojson/buek250-{slug}.geojson"

  - id: bfn-schutzgebiete
    app_layer: protected-areas
    kind: vector
    title:
      en: "Protected areas (BfN, 2019/2023)"
      de: "Schutzgebiete (BfN, 2019/2023)"
    description:
      en: "Natura 2000 sites (SCI and SPA) and German nature reserves intersecting each living lab."
      de: "Natura-2000-Gebiete (FFH und Vogelschutz) und Naturschutzgebiete je Reallabor."
    source:
      provider: "Bundesamt fuer Naturschutz (BfN)"
      dataset: "Schutzgebiete in Deutschland (FFH 2019, Vogelschutz 2019, Naturschutzgebiete 2023)"
      url: "https://geodienste.bfn.de/schutzgebiete"
      metadata: "https://gdk.gdi-de.org/geonetwork/srv/api/records/bec888f9-ba0c-42dc-846e-177b8265dafa"
      license: "Nutzungsbestimmungen fuer die Bereitstellung von Geodaten des Bundes (GeoNutzV)"
      attribution: "Datenquelle: Bundesamt fuer Naturschutz (BfN)"
      citation: "BfN: Schutzgebiete in Deutschland. https://geodienste.bfn.de/schutzgebiete"
      note: "Nicht fuer Planungszwecke geeignet."
    build:
      script: python/fetch_protected_areas.py
    wfs:
      url: "https://geodienste.bfn.de/ogc/wfs/schutzgebiet"
      version: "2.0.0"
      source_crs: "EPSG:25832"
      bbox_crs: "urn:ogc:def:crs:EPSG::4326"
      bbox_pad_deg: 0.05
      count: 5000
      coordinate_precision: 0.000001
      max_response_bytes: 104857600
      output_dir: data/geojson
      typenames:
        natura2000-sci: "bfn_sch_Schutzgebiet:Fauna_Flora_Habitat_Gebiete"
        natura2000-spa: "bfn_sch_Schutzgebiet:Vogelschutzgebiete"
        naturschutzgebiet: "bfn_sch_Schutzgebiet:Naturschutzgebiete"
    output:
      geojson_pattern: "data/geojson/protected-areas-{slug}.geojson"
